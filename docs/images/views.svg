<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
    <title id="title">Two views, one CSV dataset</title><desc id="desc">The app opens as owner. The view menu switches to a single person&#x27;s preview.</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B99AFF"/></marker></defs>
    <rect width="960" height="410" rx="22" fill="#0B0F19"/>
    <g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="42" fill="#F9FAFB" font-size="23" font-weight="700">Two views, one CSV dataset</text>
    <text x="30" y="70" fill="#9CA3AF" font-size="14">The app opens as owner. The view menu switches to a single person&#x27;s preview.</text><rect x="340" y="100" width="280" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="358" y="132" fill="#F9FAFB" font-size="19" font-weight="700">data/users.csv</text><text x="358" y="160" fill="#B8C2D4" font-size="14">Alex, Jordan, and Sam</text><text x="358" y="182" fill="#B8C2D4" font-size="14">Saved wellness snapshots</text><rect x="70" y="260" width="360" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="88" y="292" fill="#F9FAFB" font-size="19" font-weight="700">App owner view</text><text x="88" y="320" fill="#B8C2D4" font-size="14">Directory, totals, and CSV controls</text><text x="88" y="342" fill="#B8C2D4" font-size="14">Inspect any user&#x27;s saved data</text><rect x="530" y="260" width="360" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="548" y="292" fill="#F9FAFB" font-size="19" font-weight="700">User view</text><text x="548" y="320" fill="#B8C2D4" font-size="14">One person&#x27;s habits and progress</text><text x="548" y="342" fill="#B8C2D4" font-size="14">Chat and themes, without login</text><path d="M420 210L250 255" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M540 210L710 255" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/></g></svg>