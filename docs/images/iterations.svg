<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
    <title id="title">How AuraFit evolved</title><desc id="desc">Six refinements shaped the app and its reader-friendly documents.</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B99AFF"/></marker></defs>
    <rect width="960" height="430" rx="22" fill="#0B0F19"/>
    <g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="42" fill="#F9FAFB" font-size="23" font-weight="700">How AuraFit evolved</text>
    <text x="30" y="70" fill="#9CA3AF" font-size="14">Six refinements shaped the app and its reader-friendly documents.</text><rect x="30" y="110" width="280" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="48" y="142" fill="#F9FAFB" font-size="19" font-weight="700">1  Original app</text><text x="48" y="170" fill="#B8C2D4" font-size="14">Five tabs, live tools, dark theme</text><text x="48" y="192" fill="#B8C2D4" font-size="14">Fasting, logs, XP, and coach</text><rect x="340" y="110" width="280" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="358" y="142" fill="#F9FAFB" font-size="19" font-weight="700">2  Themes and roles</text><text x="358" y="170" fill="#B8C2D4" font-size="14">Six themes and user profiles</text><text x="358" y="192" fill="#B8C2D4" font-size="14">Owner directory and switching</text><rect x="650" y="110" width="280" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="668" y="142" fill="#F9FAFB" font-size="19" font-weight="700">3  CSV owner dashboard</text><text x="668" y="170" fill="#B8C2D4" font-size="14">Three sample users, no login</text><text x="668" y="192" fill="#B8C2D4" font-size="14">Selected-user snapshot views</text><rect x="30" y="280" width="280" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="48" y="312" fill="#F9FAFB" font-size="19" font-weight="700">4  Chat and documents</text><text x="48" y="340" fill="#B8C2D4" font-size="14">Restore the bottom-right coach</text><text x="48" y="362" fill="#B8C2D4" font-size="14">Plain-English guide and history</text><rect x="340" y="280" width="280" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="358" y="312" fill="#F9FAFB" font-size="19" font-weight="700">5  Streamlit and diagrams</text><text x="358" y="340" fill="#B8C2D4" font-size="14">Readable themes and two views</text><text x="358" y="362" fill="#B8C2D4" font-size="14">Streamlit and formatted guides</text><rect x="650" y="280" width="280" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="668" y="312" fill="#F9FAFB" font-size="19" font-weight="700">6  Reader-focused guides</text><text x="668" y="340" fill="#B8C2D4" font-size="14">Short development summaries</text><text x="668" y="362" fill="#B8C2D4" font-size="14">Setup and everyday app use</text><path d="M315 165L330 165" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M625 165L640 165" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 225L790 250L170 250L170 270" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M315 335L330 335" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M625 335L640 335" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/></g></svg>