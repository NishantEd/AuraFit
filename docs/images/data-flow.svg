<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
    <title id="title">CSV starting data and browser progress</title><desc id="desc">CSV seeds the starting stats. New actions stay in the browser; the source file stays unchanged.</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#B99AFF"/></marker></defs>
    <rect width="960" height="430" rx="22" fill="#0B0F19"/>
    <g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="42" fill="#F9FAFB" font-size="23" font-weight="700">CSV starting data and browser progress</text>
    <text x="30" y="70" fill="#9CA3AF" font-size="14">CSV seeds the starting stats. New actions stay in the browser; the source file stays unchanged.</text><rect x="30" y="125" width="240" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="48" y="157" fill="#F9FAFB" font-size="19" font-weight="700">CSV file</text><text x="48" y="185" fill="#B8C2D4" font-size="14">Editable rows and columns</text><text x="48" y="207" fill="#B8C2D4" font-size="14">One record per user</text><rect x="360" y="125" width="240" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="378" y="157" fill="#F9FAFB" font-size="19" font-weight="700">Python or Streamlit</text><text x="378" y="185" fill="#B8C2D4" font-size="14">Packages the data safely</text><text x="378" y="207" fill="#B8C2D4" font-size="14">Builds the app page</text><rect x="690" y="125" width="240" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="708" y="157" fill="#F9FAFB" font-size="19" font-weight="700">Your browser</text><text x="708" y="185" fill="#B8C2D4" font-size="14">Five tabs and chat</text><text x="708" y="207" fill="#B8C2D4" font-size="14">Per-user saved changes</text><rect x="265" y="285" width="430" height="110" rx="16" fill="#161F30" stroke="#8B5CF6"/><text x="283" y="317" fill="#F9FAFB" font-size="19" font-weight="700">Direct index.html preview</text><text x="283" y="345" fill="#B8C2D4" font-size="14">Uses the included CSV copy</text><text x="283" y="367" fill="#B8C2D4" font-size="14">Import CSV loads an edited file</text><path d="M275 180L350 180" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M605 180L680 180" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 245L480 280" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 340L815 340L815 245" fill="none" stroke="#B99AFF" stroke-width="3" marker-end="url(#arrow)"/></g></svg>